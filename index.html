<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Page</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav>
    <div class="logo">Brand</div>
    <button class="nav-btn" id="buyNowTop">Buy Now</button>
  </nav>

  <main>
    <section class="hero">
      <h1>Premium Product</h1>
      <p>Simple. Effective. Built to convert.</p>
      <button class="primary-btn" id="buyNow">Buy Now</button>
    </section>

    <section class="features">
      <div class="feature">
        <h3>Fast</h3>
        <p>Instant access after purchase.</p>
      </div>
      <div class="feature">
        <h3>Secure</h3>
        <p>Checkout handled externally.</p>
      </div>
      <div class="feature">
        <h3>Reliable</h3>
        <p>Used by real people.</p>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
